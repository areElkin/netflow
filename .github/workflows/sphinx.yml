name: Build and Deploy Sphinx Docs

on:
  push:
    branches:
      - main  # or your default branch
    paths:
      - 'docs/**'
      - '.github/workflows/sphinx.yml'
      - 'pyproject.toml'
      - 'netflow/**' #rebuild docs when source code changes


permissions:
  contents: write
  
jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' #Updated to match dev env

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[docs]' #installs netflow and [docs] dependencies from pyproject.toml 

    - name: Build documentation
      run: |
        sphinx-build -v -b html docs/source docs/build/html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/build/html
